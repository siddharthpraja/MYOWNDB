<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - MyExcelDB</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    data-page="register"
    class="min-h-screen bg-slate-100 flex items-center justify-center p-6"
  >
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div
          class="inline-flex w-14 h-14 bg-green-600 rounded-2xl items-center justify-center text-white text-2xl font-bold"
        >
          X
        </div>

        <h1 class="text-3xl font-bold text-slate-900 mt-4">MyExcelDB</h1>

        <p class="text-slate-500 mt-2">Create your Excel database</p>
        
      </div>

      <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        <h2 class="text-xl font-semibold mb-6">Create account</h2>

        <div
          id="authError"
          class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"
        ></div>

        <form id="authForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-2"> Name </label>

            <input
              name="name"
              required
              autocomplete="name"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-green-500"
              placeholder="Your name"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-2"> Email </label>

            <input
              name="email"
              type="email"
              required
              autocomplete="email"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-green-500"
              placeholder="you@example.com"
            />
          </div>

          <div>
            <label class="block text-sm font-medium mb-2"> Password </label>

            <input
              name="password"
              type="password"
              minlength="6"
              required
              autocomplete="new-password"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-green-500"
              placeholder="At least 6 characters"
            />
          </div>

          <button
            id="submitButton"
            type="submit"
            class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition"
          >
            Create account
          </button>
        </form>

        <div class="text-center mt-6 text-sm text-slate-500">
          Already have an account?

          <a
            href="/login.html"
            class="text-green-600 font-semibold hover:underline"
          >
            Login
          </a>
        </div>
        <div class="text-center mt-4 text-sm">
    <a
        href="docs.html"
        class="text-slate-500 hover:text-green-600 hover:underline"
    >
        Documentation
    </a>
</div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
