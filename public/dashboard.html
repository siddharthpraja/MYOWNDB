<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard - MyExcelDB</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body data-page="dashboard" class="min-h-screen bg-slate-100">
    <header
      class="h-16 bg-white border-b border-slate-200 flex items-center px-6"
    >
      <div class="font-bold text-xl text-slate-900">
        My<span class="text-green-600">Excel</span>DB
      </div>

      <div class="flex items-center justify-end ml-auto">
        <button
          id="logoutButton"
          class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-900">
          Welcome,
          <span id="userName"></span>
        </h1>

        <p id="userEmail" class="text-slate-500 mt-2"></p>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold">Your database</h2>

            <p class="text-slate-500 mt-1">
              Your personal workbook is stored as an XLSX file.
            </p>
          </div>

          <button
            id="openSpreadsheet"
            class="px-5 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl"
          >
            Open Spreadsheet
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
